# ⚠️  Auto-disabled 2026-05-12: VPS Hostinger 31.97.109.177 shutdown.
# Service đã chuyển Mac M1 homelab. Deploy = manual rsync + restart trên homelab.
# Re-enable: uncomment `push:` block + rewrite deploy step cho target mới.

name: Deploy CFA to VPS

on:
  # push:  # disabled — VPS shutdown 2026-05-12
  # branches: [main]
  workflow_dispatch:

concurrency:
  group: cfa-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH + pull + restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/cfa
            git fetch --all
            git reset --hard origin/main

            # Idempotent Traefik dynamic config copy
            cp deploy/traefik-cfa.yml /srv/traefik/data/dynamic/cfa.yml

            # Always up -d (idempotent); reload nginx so volume-mounted
            # /etc/nginx/conf.d/default.conf changes land without recreate.
            docker compose up -d
            docker exec cfa nginx -s reload 2>/dev/null || true
            docker compose ps

      - name: Smoke test
        run: |
          sleep 8
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://lesson.leaprep.com/)
          echo "Landing: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://lesson.leaprep.com/ethics/lesson/1/)
          echo "Ethics L1: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://lesson.leaprep.com/ethics/lesson/2/)
          echo "Ethics L2: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://lesson.leaprep.com/ethics/lesson/3/)
          echo "Ethics L3: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

          echo "Deploy verified"
